name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          ./scripts/package-release.sh "${GITHUB_REF_NAME}"
          KEEPMEALIVE_SKIP_BUILD=1 ./scripts/make-dmg.sh "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-pushing an existing tag (e.g. after a history rewrite) must not fail or
          # replace the DMG people already downloaded and checksummed.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving its assets as they are."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "build/KeepMeAlive-${GITHUB_REF_NAME}.dmg" \
            "build/KeepMeAlive-${GITHUB_REF_NAME}.dmg.sha256" \
            "build/KeepMeAlive-${GITHUB_REF_NAME}.zip" \
            "build/KeepMeAlive-${GITHUB_REF_NAME}.zip.sha256" \
            --title "KeepMeAlive ${GITHUB_REF_NAME}" --generate-notes
