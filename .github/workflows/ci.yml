name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Bundle app
        run: ./scripts/build-app.sh
      - name: Build DMG
        run: KEEPMEALIVE_SKIP_BUILD=1 ./scripts/make-dmg.sh
      - name: Smoke test CLI (read-only)
        run: |
          build/KeepMeAlive.app/Contents/MacOS/KeepMeAlive help
          build/KeepMeAlive.app/Contents/MacOS/KeepMeAlive preview
      - name: Lint shell scripts
        run: |
          for f in scripts/*.sh Resources/watchdog.sh; do sh -n "$f"; done
          plutil -lint Resources/Info.plist
